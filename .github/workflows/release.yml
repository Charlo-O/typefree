name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "V*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string
      macos_signing_mode:
        description: "macOS signing mode. signed-notarized requires Apple signing and notarization secrets."
        required: false
        default: "unsigned"
        type: choice
        options:
          - unsigned
          - signed-notarized

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name || github.event.inputs.version }}
  cancel-in-progress: false

env:
  MACOS_RELEASE_SIGNING_MODE: ${{ github.event.inputs.macos_signing_mode || 'unsigned' }}

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      macos_signing_mode: ${{ steps.meta.outputs.macos_signing_mode }}
      macos_release_note: ${{ steps.meta.outputs.macos_release_note }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
            version="${version#v}"
            version="${version#V}"
            tag_name="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
              source_ref="${tag_name}"
            else
              source_ref="${GITHUB_SHA}"
            fi
          else
            tag_name="${GITHUB_REF_NAME}"
            version="${tag_name#v}"
            version="${version#V}"
            source_ref="${tag_name}"
          fi

          macos_signing_mode="${MACOS_RELEASE_SIGNING_MODE:-unsigned}"
          case "${macos_signing_mode}" in
            unsigned|signed-notarized) ;;
            *)
              echo "Unsupported macOS signing mode: ${macos_signing_mode}" >&2
              exit 1
              ;;
          esac

          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "${macos_signing_mode}" != "unsigned" ]]; then
            echo "Tag-triggered releases must use unsigned macOS artifacts unless the signed lane is explicitly selected through workflow_dispatch." >&2
            exit 1
          fi

          if [[ "${macos_signing_mode}" == "signed-notarized" ]]; then
            macos_release_note="Note: macOS artifacts in this release are signed and notarized."
          else
            macos_release_note="Note: macOS artifacts in this release are unsigned builds."
          fi

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "macos_signing_mode=${macos_signing_mode}" >> "${GITHUB_OUTPUT}"
          echo "macos_release_note=${macos_release_note}" >> "${GITHUB_OUTPUT}"

  frontend-verify:
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend boundaries and tests
        run: npm run verify:frontend

  rust-preflight:
    needs: prepare-release
    name: Rust preflight (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            key-prefix: release-preflight-linux-rust
          - platform: macos-latest
            target: aarch64-apple-darwin
            key-prefix: release-preflight-macos-aarch64-rust
          - platform: macos-latest
            target: x86_64-apple-darwin
            key-prefix: release-preflight-macos-x64-rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-tauri-rust
        with:
          key-prefix: ${{ matrix.key-prefix }}

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        uses: ./.github/actions/setup-tauri-linux

      - name: Verify Tauri Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Run Tauri Rust clipboard image tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --manifest-path src-tauri/Cargo.toml clipboard_images --lib

  release-config-verify:
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release identity and workflow gates
        run: npm run test:tauri-release-config && npm run test:macos-release-identity && npm run test:release-signing-policy && npm run test:github-workflows

  ensure-release-tag:
    needs:
      - prepare-release
      - frontend-verify
      - rust-preflight
      - release-config-verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source_ref }}

      - name: Ensure release tag exists
        shell: bash
        run: |
          tag_name="${{ needs.prepare-release.outputs.tag_name }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
            echo "Tag ${tag_name} already exists on origin."
            exit 0
          fi

          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "Expected pushed tag ${tag_name} to exist on origin."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag_name}" -m "Release ${tag_name}"
          git push origin "${tag_name}"

  build:
    needs:
      - prepare-release
      - ensure-release-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-tauri-rust
        with:
          key-prefix: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        uses: ./.github/actions/setup-tauri-linux

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (macOS unsigned)
        if: (startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')) && needs.prepare-release.outputs.macos_signing_mode == 'unsigned'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag_name }}
          releaseName: "Typefree v__VERSION__"
          releaseBody: |
            Installers and app source archives are attached below.

            ${{ needs.prepare-release.outputs.macos_release_note }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --no-sign

      - name: Verify macOS signing secrets
        if: (startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')) && needs.prepare-release.outputs.macos_signing_mode == 'signed-notarized'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY_P8: ${{ secrets.APPLE_API_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY_P8; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS signing secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          api_key_path="${RUNNER_TEMP}/apple-notary-api-key.p8"
          printf '%s' "${APPLE_API_PRIVATE_KEY_P8}" > "${api_key_path}"
          chmod 600 "${api_key_path}"

          if [[ ! -s "${api_key_path}" ]]; then
            echo "Generated APPLE_API_KEY_PATH file is empty." >&2
            exit 1
          fi

          echo "APPLE_API_KEY_PATH=${api_key_path}" >> "${GITHUB_ENV}"

      - name: Build Tauri app (macOS signed/notarized)
        if: (startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')) && needs.prepare-release.outputs.macos_signing_mode == 'signed-notarized'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag_name }}
          releaseName: "Typefree v__VERSION__"
          releaseBody: |
            Installers and app source archives are attached below.

            ${{ needs.prepare-release.outputs.macos_release_note }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Verify macOS bundle identity
        if: startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')
        run: node scripts/verify-macos-release-identity.js --require-bundle

      - name: Verify macOS signing and notarization
        if: (startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')) && needs.prepare-release.outputs.macos_signing_mode == 'signed-notarized'
        run: bash scripts/verify-macos-signed-artifacts.sh

      - name: Build Tauri app (Linux/Windows)
        if: ${{ !(startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')) }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag_name }}
          releaseName: "Typefree v__VERSION__"
          releaseBody: |
            Installers and app source archives are attached below.

            ${{ needs.prepare-release.outputs.macos_release_note }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  upload-source-bundle:
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Create source archives
        shell: bash
        run: |
          mkdir -p dist-release
          git archive \
            --format=zip \
            --output="dist-release/typefree-${{ needs.prepare-release.outputs.version }}-source.zip" \
            "${{ needs.prepare-release.outputs.tag_name }}"
          git archive \
            --format=tar.gz \
            --output="dist-release/typefree-${{ needs.prepare-release.outputs.version }}-source.tar.gz" \
            "${{ needs.prepare-release.outputs.tag_name }}"

      - name: Upload source archives to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          draft: true
          files: |
            dist-release/typefree-${{ needs.prepare-release.outputs.version }}-source.zip
            dist-release/typefree-${{ needs.prepare-release.outputs.version }}-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs:
      - prepare-release
      - upload-source-bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release after all artifacts upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false

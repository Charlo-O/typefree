name: Build Client

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Client platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: read

concurrency:
  group: client-build-${{ github.event.inputs.platform }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows x64
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-tauri-rust
        with:
          key-prefix: client-build-windows-x64

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows client
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: typefree-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
          if-no-files-found: error

  macos:
    name: Build macOS ${{ matrix.target }}
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: typefree-macos-aarch64
          - target: x86_64-apple-darwin
            artifact: typefree-macos-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-tauri-rust
        with:
          key-prefix: client-build-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build unsigned macOS client
        run: npm run tauri:build -- --target ${{ matrix.target }} --no-sign

      - name: Upload macOS client
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  linux:
    name: Build Linux x64
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-tauri-rust
        with:
          key-prefix: client-build-linux-x64

      - name: Install Linux dependencies
        uses: ./.github/actions/setup-tauri-linux

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux client
        shell: bash
        run: |
          # linuxdeploy and appimagetool fetch extra binaries from GitHub releases at
          # bundle time; those downloads flake intermittently. The compile output is
          # cached, so a single retry only re-runs the bundlers.
          if ! npm run tauri:build -- --target x86_64-unknown-linux-gnu; then
            echo "::warning::tauri build failed, retrying once (linuxdeploy/appimagetool downloads are flaky)"
            sleep 15
            npm run tauri:build -- --target x86_64-unknown-linux-gnu
          fi

      - name: Upload Linux client
        uses: actions/upload-artifact@v4
        with:
          name: typefree-linux-x64
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**
          if-no-files-found: error
